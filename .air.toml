root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -gcflags='all=-N -l' -o ./tmp/wago ."
  bin = "./tmp/wago"
  args_bin = ["serve"]

  delay = 500 # Reduced from 1000ms so it feels faster after typing

  exclude_dir = [
    "assets",
    "tmp",
    "vendor",
    "testdata",
    "pb_data",
    "pb_public",
    "pb_hooks",
    ".git",
    "frontend"
  ]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "tpl", "tmpl", "html"]

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[screen]
  clear_on_rebuild = true # Clears terminal so you see fresh errors immediately
  keep_scroll = true
