# fly.toml app configuration file generated for innbell-db on 2024-01-06T17:27:14+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "wago"
primary_region = "fra"

[mounts]
source = "wago_data"
destination = "/app/pb_data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[http_service.concurrency]
type = "requests"
soft_limit = 500
hard_limit = 550